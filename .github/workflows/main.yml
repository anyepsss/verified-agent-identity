name: Verify Human Identity

on:
  workflow_dispatch:
    inputs:
      agent_name:
        description: 'anyepsss'
        required: true
        default: 'anyepsss'
      agent_description:
        description: 'anyepsss'
        required: true
        default: 'anyepsss AI Agent'

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Step 1 - Install ClawHub skill
        run: npx clawhub@0.8.0 install verified-agent-identity

        
- name: Create package.json inside skill
  run: |
    cd skills/verified-agent-identity
    npm init -y
    npm install @0xpolygonid/js-sdk

    
      - name: Step 2 - Create new Ethereum Identity
        run: |
          cd skills/verified-agent-identity
          node scripts/createNewEthereumIdentity.js

      - name: Step 3 - Link Human to Agent
        run: |
          cd skills/verified-agent-identity
          node scripts/manualLinkHumanToAgent.js \
            --challenge '{"name": "anyepsss", "description": "anyepsss AI Agent"}'
