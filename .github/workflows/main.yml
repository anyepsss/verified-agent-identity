name: Verify Human Identity

on:
  workflow_dispatch:
    inputs:
      agent_name:
        description: 'anyep'
        required: true
        default: 'anyep'
      agent_description:
        description: 'anyep'
        required: true
        default: 'anyep AI Agent'

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Step 1 - Install ClawHub skill
        run: npx clawhub@latest install verified-agent-identity

      - name: Install script dependencies
        run: |
          cd skills/verified-agent-identity
          npm install

      - name: Step 2 - Create new Ethereum Identity
        run: |
          cd skills/verified-agent-identity
          node scripts/createNewEthereumIdentity.js

      - name: Step 3 - Link Human to Agent
        run: |
          cd skills/verified-agent-identity
          node scripts/manualLinkHumanToAgent.js \
            --challenge '{"name": "anyepsss", "description": "anyepsss AI Agent"}'
